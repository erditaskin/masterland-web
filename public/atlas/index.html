$('#panel').addEventListener('click',e=>{let b=e.target.closest('[data-expand]');if(b){const n=Number(b.dataset.expand);expanded.has(n)?expanded.delete(n):expanded.add(n);renderPanel();$(`[data-expand="${n}"]`)?.focus({preventScroll:true});return}b=e.target.closest('[data-filter]');if(b){filter=b.dataset.filter;renderPanel();$(`[data-filter="${filter}"]`)?.focus({preventScroll:true});return}b=e.target.closest('[data-rank]');if(b){rank=Number(b.dataset.rank);renderPanel();$(`[data-rank="${rank}"]`)?.focus({preventScroll:true});return}if(e.target.closest('#expandAll')){expanded=expanded.size===current().producers.length?new Set():new Set(current().producers.map((_,i)=>i));renderPanel();$('#expandAll')?.focus({preventScroll:true})}});
$('#menuToggle').addEventListener('click',()=>menu(true));$('#closeNav').addEventListener('click',()=>menu(false));$('#overlay').addEventListener('click',()=>menu(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sidebar').classList.contains('visible'))menu(false);if(e.key==='Tab'&&$('#sidebar').classList.contains('visible')&&window.innerWidth<=720){const els=$$('#sidebar button:not(.hidden),#sidebar input');const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
$('#brandIcon').innerHTML=icon('compass');$('#searchIcon').innerHTML=icon('search');$('#menuToggle').innerHTML=icon('menu');$('#closeNav').innerHTML=icon('close');
const mobileQuery=window.matchMedia('(max-width:720px)');function syncMenuAccess(){const open=$('#sidebar').classList.contains('visible');$('#sidebar').inert=mobileQuery.matches&&!open;$('.main').inert=mobileQuery.matches&&open}mobileQuery.addEventListener('change',syncMenuAccess);syncMenuAccess();
render();
</script>
</body>
</html>
