<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Explore Masterland’s cities, production chains and mastery rewards.">
<meta name="theme-color" content="#143d39">
<title>World Atlas · Masterland</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/navigation.css?v=illustrated">
<link rel="stylesheet" href="/atlas/game-art.css?v=20261119-player">
<link rel="stylesheet" href="/atlas/player.css?v=regional-detail">
</head>
<body class="atlas-site illustrated-site">
<!-- site:header -->
<header class="site-header">
<div class="site-header-inner">
<a class="site-brand" href="/"><img src="/assets/icon.png" width="33" height="33" alt="">Masterland</a>
<nav class="site-nav" aria-label="Main navigation"><a href="/" data-tr="Ana sayfa" data-en="Home">Ana sayfa</a>
<a href="/game/" data-tr="Oyun" data-en="Game">Oyun</a>
<a href="/atlas/" aria-current="page" data-tr="Atlas" data-en="Atlas">Atlas</a>
<a href="/support/" data-tr="Destek" data-en="Support">Destek</a>
<a href="/privacy/" data-tr="Gizlilik" data-en="Privacy">Gizlilik</a></nav>
<div class="site-languages" role="group" aria-label="Dil / Language">
<button type="button" data-set-language="tr" lang="tr" aria-label="Türkçe">TR</button>
<button type="button" data-set-language="en" lang="en" aria-label="English">EN</button>
</div>
</div>
</header>
<!-- /site:header -->
<main class="player-atlas">
 <section class="atlas-overview" aria-label="Masterland">
  <div class="atlas-map" id="atlas-viewport">
   <div id="atlas-world">
    <img src="/assets/game/atlas-illustrated.webp" srcset="/assets/game/atlas-illustrated.webp 1672w, /assets/game/atlas-illustrated-2x.webp 3344w" sizes="100vw" width="1672" height="941" alt="" fetchpriority="high" draggable="false">
    <div id="atlas-detail-tiles" aria-hidden="true"></div>
    <div id="map-pins" role="group" aria-label="City markers"></div>
   </div>
  </div>
  <div class="atlas-map-heading">
   <h1 data-tr="Dünya Atlası" data-en="World Atlas">World Atlas</h1>
   <details class="atlas-directory">
    <summary data-tr="Şehirler" data-en="Cities">Cities</summary>
    <label data-tr="Şehir veya ürün ara" data-en="Find a city or item" for="atlas-search">Find a city or item</label>
    <input id="atlas-search" type="search" autocomplete="off">
    <div id="city-directory"></div>
   </details>
  </div>
  <div class="atlas-zoom">
   <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
   <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
   <button type="button" id="zoom-reset" data-tr="Haritayı göster" data-en="Show map">Show map</button>
  </div>
  <p id="map-notice" role="status" hidden></p>
  <aside class="atlas-selection" id="atlas-selection"></aside>
 </section>
 <section id="city-detail" aria-labelledby="city-heading"></section>
</main>
<script src="/language.js?v=20261119"></script>
<script src="/atlas/catalog.js?v=illustrated"></script>
<script src="/atlas/game-art.js?v=20261119-player"></script>
<script src="/atlas/player.js?v=regional-detail"></script>
</body>
</html>
