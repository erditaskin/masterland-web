const P={chev:'m8 5 7 7-7 7',tree:'M5 3v17h14M5 8h14M5 14h14m0-8v4m0 2v4m0 2v4',search:'m21 21-6-6M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14Z',menu:'M3 6h18M3 12h18M3 18h18',leaf:'M20 3C7 1 1 7 5 15s17 5 15-12ZM4 21 16 8',cube:'m12 2 10 6-10 6L2 8l10-6Zm-10 6v10l10 6 10-6V8M12 14v10',horse:'M7 21v-8L4 11l2-5 3-2 1-3 3 3c6 2 7 8 7 17M9 8h.1M6 11h4m2 3c2 0 3-2 3-4',crystal:'m12 2 7 6-2 12-5 2-5-2L5 8l7-6Zm0 0v20M5 8l7 4 7-4M7 20l5-8 5 8',book:'M3 3h7l2 2 2-2h7v17h-7l-2 2-2-2H3V3Zm9 2v17M6 7h3m-3 4h3m6-4h3m-3 4h3',medal:'m8 15-3 8 7-3 7 3-3-8M12 2a8 8 0 1 0 0 16 8 8 0 0 0 0-16Z',frame:'M2 3h20v18H2V3Zm3 3h14v12H5V6',map:'m2 5 7-3 6 3 7-3v17l-7 3-6-3-7 3V5Zm7-3v17m6-14v17',check:'m5 12 4 4L19 6',info:'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 8v7m0-11h.1'};
const icon=(n,cls='icon')=>`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${P[n]||P.leaf}"/></svg>`;
const norm=s=>s.toLocaleLowerCase(lang==='tr'?'tr':'en').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ı/g,'i');
function tag(kind){return `<span class="node-tag ${kind}">${t(kind==='adaptation'?'proposal':kind)}</span>`}
function node(id,label,children,{symbol='tree',kind='',sub='',root=false,product=false,step=0,html='',art=''}={}){return {id,label,children,symbol,kind,sub,root,product,step,html,art}}
function bilingualText(x){return x.tr+' '+x.en}
function prompt(name,detail,material,asset='product'){
 const c=current();if(lang==='tr')return `Masterland için ${asset==='background'?'tek ve kesintisiz tam ekran arka plan':asset==='frame'?'ayrı şeffaf arayüz çerçevesi':'tek şeffaf ürün ikonu'} çiz. Şehir: ${L(c.name)}. Konu: ${name}. ${detail} Malzeme ve renk: ${material} Sıcak, renkli fantastik mobil merge oyunu; özgün, yumuşak hacimli boyama. Ürünler küçük hücrede okunaklı, tek odaklı ve hafif üç çeyrek açılı olsun. Üst soldan tutarlı yumuşak ışık. Arka plan ise şehir kimliğini üst manzarada ve tahta kenarlarında taşı; arayüz altındaki merkezi sakin tut. Dinamik ad, sayı, düğme yazısı, logo veya filigran çizme. UO sprite veya karakter görsellerini kopyalama. ${ci===0?'Denizi az, uzak ve ikincil tut; bahçeler ve yeşil köy baskın olsun.':''}`;
 return `Draw ${asset==='background'?'one continuous full-screen background':asset==='frame'?'a separate transparent interface frame':'one transparent product icon'} for Masterland. City: ${L(c.name)}. Subject: ${name}. ${detail} Materials and colors: ${material} Warm, colorful fantasy mobile merge-game art; original softly modeled painting. Products must be readable in small cells, with one focal subject and a slightly elevated three-quarter view. Consistent soft upper-left lighting. For backgrounds, place city identity in the upper scenery and board edges; keep the UI-covered center quiet. No dynamic names, numbers, button labels, logos or watermarks. Do not copy UO sprites or character artwork. ${ci===0?'Keep the sea minimal, distant and secondary; gardens and a green village dominate.':''}`;
}
function promptHtml(id,text){promptStore.set(id,text);return `<div class="leaf"><div class="prompt-head"><h4>${t('prompt')}</h4><button class="copy" data-copy="${id}">${t('copy')}</button></div><div class="prompt">${E(text)}</div></div>`}
const textLeaf=(heading,body)=>`<div class="leaf"><h4>${E(heading)}</h4><p>${E(body)}</p></div>`;
function sourceHtml(key,kind,item){const s=DATA.sources[key];return `<div class="leaf"><p>${t(kind==='existing'?'original':kind==='uo'?'uoNote':s?'adaptationNote':'missingSource')}</p>${item?.canonicalId?`<p>${t('id')}: <code>${E(item.canonicalId)}</code></p>`:''}${s?`<p><a class="source-link" href="${E(s.url)}" target="_blank" rel="noopener noreferrer">${E(s.title)} ↗</a></p>`:''}</div>`}
function productNode(p,item,n,pi){const id=`p${pi}-i${n}`;return node(id,L(item.name),[
 node(id+'-shape',t('shape'),[],{html:textLeaf(t('shape'),L(item.detail))}),
 node(id+'-material',t('surface'),[],{html:textLeaf(t('surface'),L(item.surface||p.visual))}),
 node(id+'-light',t('lighting'),[],{html:textLeaf(t('lighting'),lang==='tr'?'Sıcak ve yumuşak üst sol ışık; küçük ölçekte okunur dış hat. Parıltı malzemenin yerini almaz; her basamak özgün biçimini korur.':'Warm, soft upper-left light; an outline readable at small sizes. Glow does not replace physical material; each step retains its own form.')}),
 node(id+'-prompt',t('prompt'),[],{html:promptHtml(id,prompt(L(item.name),L(item.detail),L(item.surface||p.visual)))}),
 node(id+'-source',t('status'),[],{html:sourceHtml(item.source,item.kind,item)})
 ],{art:atlasArt.sprite(item.sprite),product:true,step:n+1,kind:item.kind,sub:lang==='tr'?item.name.en:'',symbol:'leaf'});}
function titlesHtml(p){const j=DATA.professions[p.profession];return `<div class="leaf"><h4>${t('titleFamily')}</h4><div class="title-list">${DATA.ranks.map((r,n)=>`<div class="title-row"><span class="rank-number">${n+1}</span><span>${E(L(r)+' '+L(j.name))}<small>${atlasArt.rank(DATA.rankProgress[n],lang)}</small></span></div>`).join('')}</div><p>${t('badgeNote')}</p></div>`}
function makeTree(){
 promptStore=new Map();const c=current();
 const assets=lang==='tr'?['Tek kesintisiz arka plan','Şeffaf şehir tabelası','Şeffaf ilan panosu','Şeffaf üretici rafı','Şeffaf tahta çerçevesi','Şeffaf alt menü çerçevesi','Her üretici için ayrı simge','Her ürün için ayrı şeffaf ikon']:['One continuous background','Transparent city sign','Transparent order board','Transparent producer tray','Transparent board frame','Transparent bottom-navigation frame','A separate emblem for each producer','A separate transparent icon for every product'];
 const world=node('world',t('world'),[
 node('background',t('background'),[],{html:textLeaf(t('background'),L(c.art.background))+promptHtml('background',prompt(L(c.name),L(c.art.background)+' '+L(c.art.edges),L(c.art.materials),'background')),symbol:'map'}),
 node('edges',t('edges'),[],{html:textLeaf(t('edges'),L(c.art.edges)),symbol:'leaf'}),
 node('materials',t('materials'),[],{html:textLeaf(t('materials'),L(c.art.materials))+promptHtml('frame',prompt(t('materials'),L(c.art.materials),L(c.art.materials),'frame')),symbol:'frame'}),
 node('assets',t('assetPack'),[],{html:`<div class="leaf">${assets.map(s=>`<p>${E(s)}</p>`).join('')}<p>${t('promptAbout')}</p></div>`,symbol:'cube'})
 ],{root:true,symbol:'map',sub:t('worldSub'),kind:c.art.approved?'approved':'proposal'});
 const groups=node('groups',t('groups'),c.producers.map((p,pi)=>node(`p${pi}`,L(p.name),[
 node(`p${pi}-art`,t('producerArt'),[],{html:textLeaf(t('producerArt'),L(p.producerArt))+textLeaf(t('shape'),L(p.silhouette)),symbol:'frame'}),
 node(`p${pi}-products`,t('productList'),p.items.map((i,n)=>productNode(p,i,n,pi)),{symbol:'cube',sub:p.items.length+' '+t('product')}),
 node(`p${pi}-titles`,t('mastery'),[],{html:titlesHtml(p),symbol:'medal'}),
 node(`p${pi}-achievement`,t('achievement'),[],{html:`<div class="leaf"><dl><dt>${t('achievement')}</dt><dd>${E(L(p.achievement))}</dd><dt>${t('badge')}</dt><dd>${E(L(p.badge))}</dd></dl><p>${t('badgeNote')}</p></div>`,symbol:'medal'}),
 ...(p.exception?[node(`p${pi}-exception`,t('issues'),[],{html:textLeaf(t('issues'),L(p.exception)),symbol:'info'})]:[]),
 node(`p${pi}-source`,t('status'),[],{html:sourceHtml(p.source,p.kind),symbol:'book'})
 ],{art:atlasArt.producer(p.image),symbol:ci===5&&pi===2?'horse':ci===7&&pi===2?'crystal':'cube',sub:L(DATA.professions[p.profession].name)+' · '+p.items.length+' '+t('product'),kind:p.kind})),{root:true,symbol:'cube',sub:t('groupsSub')});
 const professions=new Set(c.producers.map(p=>p.profession));const combos=[{name:c.combo,requires:[...professions],titles:DATA.ranks.map(r=>({tr:r.tr+' '+c.combo.tr,en:r.en+' '+c.combo.en}))}];
 const combination=node('combos',t('combo'),combos.map((x,k)=>node(`combo-${k}`,L(x.name),[],{html:`<div class="leaf"><p>${x.requires.map(j=>E(L(DATA.professions[j].name))).join(' + ')}</p><div class="title-list">${x.titles.map((r,n)=>`<div class="title-row"><span class="rank-number">${n+1}</span><span>${E(L(r))}<small>${atlasArt.rank(DATA.rankProgress[n],lang)}</small></span></div>`).join('')}</div><p>${t('comboRule')}</p></div>`,symbol:'medal',kind:'existing'})),{root:true,symbol:'medal',html:combos.length?'':textLeaf(t('combo'),t('noneCombo'))});
 const issues=node('issues',t('issues'),[],{root:true,symbol:'info',html:`<div class="leaf"><p>${t('cityNotice')}</p><p>${t('keepRule')}</p><p>${t(c.art.approved?'approvedNote':'openNote')}</p><p>${ci===5?t('mountNote'):ci===7?t('greenNote'):t('badgeNote')}</p><p>${t('docs')}</p></div>`});
 const references=node('refs',t('sourceNode'),[],{root:true,symbol:'book',html:`<div class="leaf">${c.sourceKeys.map(k=>{const s=DATA.sources[k];return `<p><a href="${E(s.url)}" target="_blank" rel="noopener noreferrer">${E(s.title)} ↗</a></p>`}).join('')||E(t('missingSource'))}</div>`});
 return [world,groups,combination,issues,references];
}
function matches(n,q){return norm(n.label+' '+n.sub+' '+n.html.replace(/<[^>]*>/g,' ')).includes(q)||n.children.some(c=>matches(c,q))}
function renderNode(n,q='',force=false){if(q&&!force&&!matches(n,q))return '';const own=force||(q&&norm(n.label+' '+n.sub).includes(q));const open=q||openNodes.has(n.id);return `<details class="node ${n.root?'root':''} ${n.product?'product game-product-node':''} ${n.symbol==='crystal'?'green-crystal':''}" data-node="${n.id}" ${open?'open':''}><summary>${icon('chev','icon chev')}${n.product?`<span class="step">${String(n.step).padStart(2,'0')}</span>${n.art}`:`<span class="branch-symbol">${n.art||icon(n.symbol)}</span>`}<span class="node-label">${E(n.label)}${n.sub?`<span class="node-sub">${E(n.sub)}</span>`:''}</span>${n.kind?tag(n.kind):''}</summary>${n.html}${n.children.length?`<div class="children">${n.children.map(c=>renderNode(c,q,own)).join('')}</div>`:''}</details>`}
function cityMatch(c,q){const professionText=c.producers.map(p=>{const j=DATA.professions[p.profession].name;return DATA.ranks.map(r=>r.tr+' '+j.tr+' '+r.en+' '+j.en).join(' ')}).join(' ');return !q||norm(professionText+' '+c.name.tr+' '+c.name.en+' '+c.reference+' '+c.art.background.tr+' '+c.art.background.en+' '+c.art.materials.tr+' '+c.art.materials.en+' '+c.producers.map(p=>p.name.tr+' '+p.name.en+' '+p.items.map(i=>i.name.tr+' '+i.name.en+' '+i.detail.tr+' '+i.detail.en).join(' ')).join(' ')).includes(q)}
function renderNav(){const q=norm(query.trim());$('#cities').innerHTML=['active','candidate'].map(scope=>{const selected=DATA.cities.map((c,i)=>({c,i})).filter(({c})=>c.scope===scope&&cityMatch(c,q));return selected.length?`<div class="nav-label">${t(scope==='active'?'active':'candidate')} · ${selected.length}</div>${selected.map(({c,i})=>`<button class="city ${ci===i&&mode==='city'?'active':''}" style="--city-color:${c.color}" data-city="${i}" ${ci===i&&mode==='city'?'aria-current="page"':''}><span class="city-dot"></span><span class="city-main">${E(L(c.name))}${[5,7].includes(i)?`<small>${i===5?'Llama · Ostard · Unicorn':'Reagent Crystal · 8'}</small>`:''}</span><span class="count">${c.release?c.producers.length:atlasArt.status(c,lang)}</span></button>`).join('')}`:''}).join('')}
function renderHero(){const c=current();document.documentElement.style.setProperty('--accent',c.color);document.documentElement.style.setProperty('--tint',c.tint);$('#hero').innerHTML=mode==='sources'?`<div class="hero"><div><div class="kicker">ULTIMA ONLINE / MASTERLAND</div><h1>${t('sourceSection')}</h1><p>${t('sourceSub')}</p></div></div>`:`<div class="hero"><div><div class="kicker">MASTERLAND / ${t('cityTree')}</div><h1>${E(L(c.name))}</h1><p>${E(L(c.concept))}</p><div class="scope"><span class="chip">${t(c.art.approved?'approved':'artProposal')}</span><span class="chip amber">${atlasArt.status(c,lang)}</span></div></div><div class="metrics">${c.release?c.producers.length+' / '+c.producers.reduce((n,p)=>n+p.items.length,0):'—'}<small>${t('group')} / ${t('product')}</small></div></div>`}
function renderSources(){return `<div class="notice">${t('sourceDisclaimer')}</div><div class="source-grid">${DATA.referenceBanks.map(b=>`<article class="source-card"><h3>${E(L(b.name))}</h3><p>${E(L(b.note))}</p><ul>${b.items.map(i=>`<li>${E(L(i))}${lang==='tr'?` <small>— ${E(i.en)}</small>`:''}</li>`).join('')}</ul><a href="${E(DATA.sources[b.source].url)}" target="_blank" rel="noopener noreferrer">${E(DATA.sources[b.source].title)} ↗</a></article>`).join('')}</div><h2 class="section-title" style="margin-top:30px">${t('allSource')}</h2><div class="leaf">${Object.values(DATA.sources).map(s=>`<p><a href="${E(s.url)}" target="_blank" rel="noopener noreferrer">${E(s.title)} ↗</a></p>`).join('')}</div>`}
function renderBody(){if(mode==='sources'){$('#body').innerHTML=renderSources();return}const c=current(),q=norm(query.trim());if(!c.release){$('#body').innerHTML=`<p class="game-city-empty">${atlasArt.status(c,lang)}</p>`;return;}const tree=makeTree();const force=q&&norm(c.name.tr+' '+c.name.en+' '+c.reference).includes(q);const html=tree.map(n=>renderNode(n,q,force)).join('');$('#body').innerHTML=`${c.scope==='candidate'?`<div class="notice">${t('candidateNotice')}</div>`:''}${ci===5||ci===7?`<div class="notice">${t(ci===5?'mountNote':'greenNote')}</div>`:''}${q?`<div class="match-count">${c.producers.reduce((n,p)=>n+p.items.filter(i=>norm(i.name.tr+' '+i.name.en).includes(q)).length,0)} ${t('matches')}</div>`:''}${!q?atlasArt.standards(lang):''}${html?`<div class="tree">${html}</div>`:`<div class="empty">${t('none')}</div>`}`}
function staticText(){$('#cities').setAttribute('aria-label',t('active'));document.documentElement.lang=lang;document.title=lang==='tr'?'Masterland — İçerik Ağacı':'Masterland — Content Tree';$$('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));$$('[data-lang]').forEach(e=>{e.classList.toggle('on',e.dataset.lang===lang);e.setAttribute('aria-pressed',String(e.dataset.lang===lang))});$('#search').placeholder=t('search');$('#search').setAttribute('aria-label',t('search'));$('#clear').setAttribute('aria-label',t('clear'));$('#menu').setAttribute('aria-label',t('menu'));$('#close').setAttribute('aria-label',t('close'));$('#jumpMount').innerHTML=icon('horse')+t('mounts');$('#jumpReg').innerHTML=icon('crystal')+t('reagents');$('#jumpSource').innerHTML=icon('book')+t('sources');$('#expand').disabled=mode==='sources';$('#collapse').disabled=mode==='sources'}
function render(){staticText();renderNav();renderHero();renderBody()}
function navOpen(open){$('#aside').classList.toggle('open',open);$('#overlay').classList.toggle('open',open);$('#menu').setAttribute('aria-expanded',String(open));syncInert();if(open)$('#close').focus();else if(innerWidth<=740)$('#menu').focus()}
function syncInert(){const open=$('#aside').classList.contains('open');$('#aside').inert=innerWidth<=740&&!open;$('.main').inert=innerWidth<=740&&open}
function chooseCity(n,focusSpecial=false){ci=n;mode='city';openNodes=new Set(['world','groups',...(focusSpecial?['p2','p2-products']:[])]);render();navOpen(false);window.scrollTo({top:0,behavior:'instant'})}
$('#cities').addEventListener('click',e=>{const b=e.target.closest('[data-city]');if(b)chooseCity(Number(b.dataset.city),[5,7].includes(Number(b.dataset.city)))});
$$('[data-lang]').forEach(b=>b.addEventListener('click',()=>window.masterlandLanguage.choose(b.dataset.lang)));
window.addEventListener('masterland:language',e=>{if(lang!==e.detail){lang=e.detail;render()}});
$$('[data-jump]').forEach(b=>b.addEventListener('click',()=>{query='';$('#search').value='';$('#clear').hidden=true;if(b.dataset.jump==='sources'){mode='sources';render();window.scrollTo({top:0,behavior:'instant'})}else chooseCity(b.dataset.jump==='mounts'?5:7,true)}));
$('#body').addEventListener('toggle',e=>{const d=e.target;if(!d.matches('details[data-node]'))return;d.open?openNodes.add(d.dataset.node):openNodes.delete(d.dataset.node)},true);
$('#body').addEventListener('click',async e=>{const b=e.target.closest('[data-copy]');if(!b)return;const prompt=promptStore.get(b.dataset.copy);try{await navigator.clipboard.writeText(prompt);showToast(t('copied'))}catch{showToast(t('copyError'))}});
function showToast(s){clearTimeout(toastTimer);$('#toast').textContent=s;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,2600)}
$('#expand').addEventListener('click',()=>{$$('#body details').forEach(d=>{d.open=true;openNodes.add(d.dataset.node)})});
$('#collapse').addEventListener('click',()=>{$$('#body details').forEach(d=>d.open=false);openNodes.clear()});
$('#search').addEventListener('input',e=>{query=e.target.value;$('#clear').hidden=!query;mode='city';renderNav();renderHero();renderBody()});
$('#clear').addEventListener('click',()=>{query='';$('#search').value='';$('#clear').hidden=true;render();$('#search').focus()});
$('#menu').innerHTML=icon('menu');$('#searchIcon').innerHTML=icon('search');$('#menu').addEventListener('click',()=>navOpen(true));$('#close').addEventListener('click',()=>navOpen(false));$('#overlay').addEventListener('click',()=>navOpen(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape')navOpen(false);if(e.key==='Tab'&&innerWidth<=740&&$('#aside').classList.contains('open')){const a=$$('#aside button,#aside a');if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0].focus()}}});
matchMedia('(max-width:740px)').addEventListener('change',syncInert);syncInert();render();
</script></body></html>
